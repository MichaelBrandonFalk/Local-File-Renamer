name: Upload tested release packages

on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful Build Windows and Linux run ID
        required: true
      release_tag:
        description: Existing draft release tag (for example v1.8)
        required: true

permissions:
  actions: read
  contents: write

jobs:
  upload:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: ${{ inputs.build_run }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Validate build and draft release
        run: |
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > build.json
          gh release view "$RELEASE_TAG" --json isDraft,targetCommitish,tagName > release.json
          python3 - <<'PY'
          import json
          import os
          import re
          build = json.load(open("build.json"))
          release = json.load(open("release.json"))
          assert re.fullmatch(r"v[0-9]+(?:\.[0-9]+)+", os.environ["RELEASE_TAG"])
          assert build["path"] == ".github/workflows/build-desktop.yml"
          assert build["head_branch"] == "main" and build["event"] in {"push", "workflow_dispatch"}
          assert build["status"] == "completed" and build["conclusion"] == "success"
          assert release["isDraft"] and release["tagName"] == os.environ["RELEASE_TAG"]
          assert release["targetCommitish"] == build["head_sha"]
          PY
      - name: Download tested packages
        run: gh run download "$BUILD_RUN" --pattern 'desktop-*' --dir packages
      - name: Verify checksums and upload packages
        run: |
          VERSION_NAME="${RELEASE_TAG#v}"
          VERSION_NAME="${VERSION_NAME//./_}"
          cd packages/desktop-Windows
          test -f "Local_File_Renamer_v${VERSION_NAME}_Windows_x64.exe"
          tr -d '\r' < SHA256SUMS-Windows.txt | sha256sum -c -
          cd ../desktop-Linux
          test -f "Local_File_Renamer_v${VERSION_NAME}_Linux_Mint_amd64.deb"
          test -f "Local_File_Renamer_v${VERSION_NAME}_Linux_x64.tar.gz"
          sha256sum -c SHA256SUMS-Linux.txt
          cd ../..
          gh release upload "$RELEASE_TAG" packages/desktop-Windows/* packages/desktop-Linux/*
